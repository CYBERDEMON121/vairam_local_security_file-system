<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Fingerprint - SecureCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Setup Fingerprint Authentication</h4>
                    </div>
                    <div class="card-body text-center">
                        <p>Click the button below to register your fingerprint</p>
                        <button id="registerBtn" class="btn btn-primary btn-lg" onclick="registerFingerprint()">
                            👆 Register Fingerprint
                        </button>
                        <form id="fingerprintForm" action="/setup-fingerprint" method="post">
                            <input type="hidden" name="fingerprint_data" id="fingerprintData">
                        </form>
                        <hr>
                        <a href="/security-settings" class="btn btn-secondary">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function registerFingerprint() {
            alert('Please place your finger on the fingerprint scanner');
            setTimeout(() => {
                const fingerprintData = 'fp_' + Date.now();
                document.getElementById('fingerprintData').value = fingerprintData;
                document.getElementById('fingerprintForm').submit();
            }, 2000);
        }
    </script>
</body>
</html>
